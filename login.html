<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - SpendWise</title>

    <link rel="stylesheet" href="./style.css">

</head>


<body
    class="bg-gray-100 min-h-screen flex items-center justify-center px-4">


    <div
        class="bg-white w-full max-w-md p-8 rounded-2xl shadow-lg">


        <!-- Logo -->

        <div class="text-center mb-8">

            <a href="index.html"
                class="text-3xl font-bold text-blue-600">

                SpendWise

            </a>

            <p class="text-gray-500 mt-2">

                Welcome back! Manage your money smarter.

            </p>

        </div>


        <!-- Login Form -->

        <form id="loginForm"
            class="space-y-5">


            <div>

                <label
                    class="block mb-2 font-medium">

                    Email

                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required

                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">

            </div>


            <div>

                <label
                    class="block mb-2 font-medium">

                    Password

                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required

                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">

            </div>


            <button
                type="submit"

                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">

                Login

            </button>


        </form>


        <p
            class="text-center text-gray-600 mt-6">

            Don't have an account?

            <a href="#"
                class="text-blue-600 font-semibold">

                Sign Up

            </a>

        </p>


        <a href="index.html"
            class="block text-center text-gray-500 mt-6 hover:text-blue-600">

            ← Back to Home

        </a>


    </div>


    <script type="module" src="./main.js"></script>

</body>

</html>
